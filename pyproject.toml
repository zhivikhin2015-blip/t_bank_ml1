[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "fartrans-feature-automation"
version = "1.0.0"
description = "Temporal feature engineering and selection for FAR-Trans recommendations"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
notebooks = ["ipykernel==7.4.0", "ipython==9.17.1"]

[project.scripts]
fartrans-prepare = "research.feature_automation.prepare_data:main"
fartrans-experiment = "research.feature_automation.experiment:main"
fartrans-verify = "research.feature_automation.verify:main"
fartrans-benchmark = "research.feature_automation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research*"]
